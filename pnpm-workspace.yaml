packages:
  - apps/*
  - packages/*

# One version of each shared tool for the whole repository (docs/adr/0001).
# Packages refer to these with `catalog:`. ui and sdk-core are here too, one
# version for every app, since app-shell runs on each app's copy; moving
# them moves every app, and `pnpm check:single-copy` fails if an app strays.
# A new 0.x minor also needs every app's SDK to accept it, and app-shell's
# peer range moved with it (docs/adr/0001).
# Each app's SDK stays pinned in the app's own package.json, so each app
# moves its SDK on its own schedule, within the ui version set here.
catalog:
  "@biomejs/biome": 2.6.8
  "@commitlint/cli": 21.2.4
  "@hussmartinez/sdk-config": 0.11.4
  "@hussmartinez/sdk-core": 0.4.7
  "@hussmartinez/ui": 0.16.0
  "@playwright/test": 1.65.1
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  happy-dom: 21.0.4
  husky: 9.1.7
  lint-staged: 17.6.1
  react: 19.3.1
  react-dom: 19.3.1
  secretlint: 13.1.0
  stylelint: 18.0.0
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.0
  wrangler: 4.163.0
  yaml: 2.9.1

# Supply-chain hardening, as in the @hussmartinez SDK repositories.
# Dependency install scripts are blocked unless allowlisted here. A package
# set to false is refused on purpose, so strictDepBuilds doesn't fail on it:
# esbuild and workerd find their binaries through their optional platform
# packages, without their postinstall scripts, and core-js's only prints a
# funding message.
allowBuilds:
  core-js: false
  esbuild: false
  workerd: false
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago, except the family's
# own packages, which are pinned exactly and published with provenance.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hussmartinez/*"
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true
